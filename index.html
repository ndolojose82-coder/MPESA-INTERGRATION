<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay with M-Pesa</title>
<link rel="stylesheet" href="index.css">

</head>
<body>
<div class="card">
  <h1>Pay with M-Pesa</h1>
  <form id="f">
    <label>Phone number</label>
    <input id="phone" type="tel" placeholder="0712345678" required>
    <label>Amount (KSh)</label>
    <input id="amount" type="number" min="1" value="1" required>
    <button id="btn">Pay now</button>
  </form>
  <div id="msg"></div>
</div>
<script>

const f = document.getElementById('f'), btn = document.getElementById('btn'), msg = document.getElementById('msg');
const show = (t, cls = '') => { msg.textContent = t; msg.className = cls; };

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  show('Sending request...');
  try {
    const r = await fetch('/api/pay', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: phone.value, amount: amount.value }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    show(d.message);
    poll(d.checkoutRequestId);
  } catch (err) {
    show(err.message, 'err');
    btn.disabled = false;
  }
});

async function poll(id, tries = 0) {
  if (tries > 30) { show('Timed out. If money was deducted, contact support.', 'err'); btn.disabled = false; return; }
  const d = await (await fetch('/api/status/' + id)).json();
  if (d.status === 'success') { show(`Paid! Receipt ${d.receipt}`, 'ok'); btn.disabled = false; return; }
  if (d.status === 'cancelled') { show('You cancelled the payment.', 'err'); btn.disabled = false; return; }
  if (d.status === 'failed') { show(d.message || 'Payment failed.', 'err'); btn.disabled = false; return; }
  setTimeout(() => poll(id, tries + 1), 3000);
}
</script>
</body>
</html>
